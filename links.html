<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Yahel Malka | Role links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-one"></div>
  <div class="links-page">
    <p class="eyebrow">PRIVATE TOOL</p>
    <h1>Role links.</h1>
    <p class="lead">Copy the version you want to send. This page is not in the public navigation.</p>
    <div class="links-table-wrap">
      <table class="links-table">
        <thead>
          <tr>
            <th>Role</th>
            <th>Link</th>
            <th>Actions</th>
            <th>CV</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <script src="role-config.js?v=5"></script>
  <script>
    const rows = document.getElementById("rows");

    function allPaths(role) {
      return [role.path || "", ...(role.aliases || [])];
    }

    async function cvStatus(path) {
      if (!path) return false;
      try {
        const response = await fetch(path, { method: "HEAD" });
        return response.ok;
      } catch (error) {
        return false;
      }
    }

    async function render() {
      for (const role of Object.values(ROLES)) {
        const available = await cvStatus(role.cvPath);
        const paths = allPaths(role);
        const links = paths.map((path) => `${SITE.pagesBase}/${path}`);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>
            <b>${role.label}</b>
            <div><code>${paths.map((path) => path ? `/${path}` : "/").join(" · ")}</code></div>
          </td>
          <td>${links.map((url) => `<code>${url}</code>`).join("<br>")}</td>
          <td class="links-actions">
            ${links.map((url, index) => `<button type="button" data-copy="${url}">${index === 0 ? "Copy Link" : "Copy short link"}</button>`).join("")}
            <a href="${role.path ? `./${role.path}` : "./"}" target="_blank" rel="noreferrer">Open</a>
          </td>
          <td class="${available ? "cv-ok" : "cv-missing"}">${available ? "Available" : "Missing"}</td>
        `;
        rows.appendChild(tr);
      }
    }

    async function copyText(value) {
      if (navigator.clipboard) {
        try {
          await navigator.clipboard.writeText(value);
          return true;
        } catch (error) {
          /* fall through */
        }
      }
      const field = document.createElement("textarea");
      field.value = value;
      field.setAttribute("readonly", "");
      field.style.position = "fixed";
      field.style.left = "-9999px";
      document.body.appendChild(field);
      field.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(field);
      return ok;
    }

    document.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;
      const ok = await copyText(button.dataset.copy);
      const original = button.textContent;
      button.textContent = ok ? "Copied" : "Copy failed";
      button.classList.toggle("copied", ok);
      setTimeout(() => {
        button.textContent = original;
        button.classList.remove("copied");
      }, 1600);
    });

    render();
  </script>
</body>
</html>
